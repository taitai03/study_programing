# Xcode のプロジェクト（SakuraMart.xcodeproj）の設定。XcodeGen で作る
#   brew install xcodegen && xcodegen
# ファイルを追加・削除したときは、Xcode が自動で反映するので作り直す必要はない
name: SakuraMart
options:
  bundleIdPrefix: example.sakuramart
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SakuraMartKit:
    path: SakuraMartKit
targets:
  SakuraMart:
    type: application
    platform: iOS
    sources:
      - path: SakuraMart
        type: syncedFolder
    dependencies:
      - package: SakuraMartKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.sakuramart.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: さくらマート
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  SakuraMart:
    build:
      targets:
        SakuraMart: all
    run:
      config: Debug
