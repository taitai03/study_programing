# scripts/templates.ts が使う設定
course: ruby/intermediate
setup: bundle install --quiet && RAILS_ENV=test bin/rails db:create db:schema:load
test: bundle exec rspec && (test ! -f .task/check.sh || bash .task/check.sh)
# .gitignore で除外しているもの（ログ、キャッシュ、DBのファイル）
ignore: [log/*.log, tmp/cache/, tmp/local_secret.txt, "storage/*.sqlite3*", .bundle/, output/]
