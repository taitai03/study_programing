questions:
  - question: "`undefined method 'name' for nil (NoMethodError)` というエラーを検索するときの、検索語として適切なものはどれですか？"
    choices:
      - "`order.customer.name が動かない`"
      - "`undefined method 'name' for nil Rails` のように、エラーの固有の部分と使っている技術の名前"
      - "`エラー`"
      - 自分のコードを全部貼り付ける
    answer: 1
    explanation: 自分の変数名などを取り除いた、エラーメッセージの固有の部分で検索すると、同じ問題の情報が見つかりやすくなります。使っている言語やライブラリの名前も付けましょう。
  - question: AI ツールが提案したコードの扱いとして、適切なものはどれですか？
    choices:
      - AI が出したものは正しいので、そのまま貼り付ける
      - 自分で読んで理解し、ドキュメントや実行・テストで確かめてから使う
      - 理解できなくても、動けば使ってよい
      - AI のコードは使ってはいけない
    answer: 1
    explanation: AI の答えには、存在しないメソッドや古い書き方が含まれることがあります。理解してから使い、動作とテストで確かめるのが基本です。
  - question: 会社のプロジェクトでエラーが出ました。AI ツールに相談するときにしてはいけないことはどれですか？
    choices:
      - エラーメッセージの意味を質問する
      - 一般的な書き方の例を質問する
      - 許可されていない AI ツールに、社内のソースコードや API キーを貼り付ける
      - AI の答えを公式ドキュメントで確認する
    answer: 2
    explanation: 入力した内容が保存されたり学習に使われたりすることがあるため、社外秘の情報や秘密の鍵は、会社が許可していないツールに貼ってはいけません。使ってよいツールと範囲は、会社のルールで確認します。
