ticket: |
  ## 背景

  店長会議の資料に使っている「商品の売上ランキング」（`src/ranking.js`）について、店長から問い合わせがありました。

  > 今月のランキングを見たら、1位より2位のほうが売上が多くなっていました。先月は正しく見えたのですが……。

  テスト（`npm test`）は通っています。原因が分からないので、**デバッガとドキュメントを使って原因を特定し、直してください**。

  ## やること

  1. 開始ブランチ `start/05-research-debugging` から作業ブランチを切る
  2. 問い合わせの現象を再現する（商品がたくさんあるデータで、ランキングがおかしくなることを確かめる）
  3. ブレークポイントやログで、どこで期待と違う結果になっているかを特定する
  4. 使っているメソッドの公式ドキュメント（MDN）を読んで、原因を理解する
  5. 直して、再発防止のテストを `test/ranking.test.js` に追加する
  6. PRの説明に、**原因と、どうやって特定したか** を書いて、`start/05-research-debugging` に向けてPRを出す

  ## 受け入れ条件

  - [ ] どんな順番の注文でも、売上の多い順に並ぶ。売上が同じなら商品IDの小さい順
  - [ ] 再発防止のテストを追加している
  - [ ] PRの説明に、原因と、特定した方法を書いている
  - [ ] テスト（`npm test`）がすべて通った状態でマージしている

  ## 参考

  - VS Code で Node.js のテストをデバッグするには、「JavaScript Debug Terminal」を開いて `node --test test/ranking.test.js` を実行します（ブレークポイントで止まります）
  - MDN Web Docs https://developer.mozilla.org/ja/
hints:
  - |
    いまのテストのデータは、たまたま最初から売上の多い順に並んでいます。売上の少ない順に並んだデータで `salesRanking` を呼ぶテストを書いてみましょう。
  - |
    並べ替えは `Array.prototype.sort()` で行っています。MDN で、`sort()` に渡す比較関数が **何を返すべきか** を確かめましょう。
  - |
    比較関数は「負の数（a を先に）」「正の数（b を先に）」「0（同じ）」を返します。`true` / `false` を返すと、正しく並べ替えられません。
