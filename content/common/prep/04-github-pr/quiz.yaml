questions:
  - question: PR の説明として、レビューする人にとってもっとも親切なものはどれですか？
    choices:
      - 「修正しました」
      - 空欄のまま
      - 何のための変更か（概要）、何を変えたか、どう確認したかを書く
      - 変更したファイルの中身をすべて貼り付ける
    answer: 2
    explanation: 目的と変更内容、確認したことが書かれていると、レビューする人はどこを重点的に見ればよいかがすぐに分かります。
  - question: このアプリの中級の課題で PR を作るとき、向き先（base）のブランチはどれにしますか？
    choices:
      - "`main`"
      - "課題の開始ブランチ（`start/07-order-filter` など）"
      - 自分の作業ブランチ
      - どれでもよい
    answer: 1
    explanation: "課題は開始ブランチから作業ブランチを切り、開始ブランチに向けて PR を作ります。アプリは向き先のブランチ名から、どの課題かを判断します。"
  - question: レビューで、意図が分からない指摘をもらいました。どう対応するのがよいですか？
    choices:
      - 指摘を無視してマージする
      - 推測で直して、何も返信しない
      - 指摘の意図を質問し、理解してから対応する
      - PR を閉じて作り直す
    answer: 2
    explanation: 推測で直すと、意図と違う変更になることがあります。分からない点は質問し、対応したら返信します。指摘にはすべて返信するのが基本です。
