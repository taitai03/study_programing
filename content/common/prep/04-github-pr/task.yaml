ticket: |
  ## 背景

  CSチームから「税込でちょうど5,000円の注文に、送料がかかっている」と問い合わせがありました。さくらマートの送料は **税込5,000円以上なら無料** なので、5,000円ちょうどは無料になるはずです。

  この課題は、PRの流れを練習するためのものです。コードの修正は小さいので、**PRの出し方と、PRの説明の書き方** に集中してください。

  ## やること

  1. このコースのページの「はじめに」の手順で、課題リポジトリ（`practice-prep`）を作り、GitHub App をインストールして clone する
  2. 開始ブランチ `start/04-github-pr` から作業ブランチを切る
  3. `src/shipping.js` の送料の判定を直す。ちょうど5,000円のときのテストも `test/shipping.test.js` に追加する
  4. commit して push し、`start/04-github-pr` に向けてPRを作る。PRの説明に「概要」「変更内容」「確認したこと」を書く
  5. GitHub Actions のテストが通ったことを確かめ、PRの差分を自分で見直してからマージする

  ## 受け入れ条件

  - [ ] 税込5,000円ちょうどの送料が0円になる（4,999円は550円のまま）
  - [ ] ちょうど5,000円のときのテストを追加している
  - [ ] PRの説明に、概要・変更内容・確認したことを書いている
  - [ ] テスト（`npm test`）がすべて通った状態でマージしている

  ## 参考

  - 手元でテストを実行するには `npm test`
  - このレッスンの「PR の説明の書き方」
hints:
  - |
    「以上」は `>=`、「より大きい（超える）」は `>` です。
  - |
    PRを作るときは、画面の上の「base:」が `start/04-github-pr` になっているかを確かめましょう。`main` のままだと、課題として判定されません。
  - |
    マージしたあと、課題のページで「判定を読み直す」を押すと、最新の判定が表示されます。
