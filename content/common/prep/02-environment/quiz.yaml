questions:
  - question: "mise のようなバージョン管理ツールを使う、いちばんの理由はどれですか？"
    choices:
      - 常に最新のバージョンを使うため
      - チーム全員が、プロジェクトで決められた同じバージョンを使うため
      - インストールを速くするため
      - Git を使わずに済むようにするため
    answer: 1
    explanation: バージョンが違うと「自分のPCでは動くのに、ほかの人のPCでは動かない」ことが起きます。mise はプロジェクトのファイルを読んで、決められたバージョンを使ってくれます。
  - question: "README の手順に `cp .env.example .env` と書かれていました。この手順の意味として正しいものはどれですか？"
    choices:
      - "`.env` を削除する"
      - 共有されているひな形をコピーして、自分用の設定ファイルを作る
      - "`.env` を GitHub に公開する"
      - "`.env.example` の名前を変える"
    answer: 1
    explanation: "`.env` にはパスワードなどの秘密の設定を書くので、Git では共有しません。代わりにひな形の `.env.example` を共有し、各自がコピーして使います。"
  - question: 環境構築でエラーが出て、調べても解決しませんでした。メンターに相談するときに伝えるべきものはどれですか？
    choices:
      - 「動きません」とだけ伝える
      - 実行したコマンド、エラーメッセージの全文、すでに試したこと
      - エラーメッセージのうち、最初の1行だけ
      - PCの購入日
    answer: 1
    explanation: 何をして、何が起きて、何を試したかがそろっていると、相談された人は原因をすぐに推測できます。エラーメッセージは途中を省略せずに全文を伝えましょう。
