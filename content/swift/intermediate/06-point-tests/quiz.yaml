questions:
  - question: 「税込5,000円以上なら送料無料」という仕様をテストするとき、境界値として特に確かめるべき金額の組み合わせはどれですか？
    choices:
      - 1,000円と10,000円
      - 4,999円と5,000円
      - 0円と100,000円
      - 5,500円だけ
    answer: 1
    explanation: 結果が切り替わる境目（5,000円）と、そのすぐ手前（4,999円）を確かめます。`>` と `>=` の書き間違いはここでしか見つかりません。
  - question: バグを直すときに「先にバグを再現するテストを書いて、失敗することを確かめる」のはなぜですか？
    choices:
      - テストを書く時間を短くするため
      - そのテストが本当にバグを見つけられることを確かめ、直したあとに再発も防げるから
      - 先にテストを書かないと、コードを直せないから
      - CIの時間を短くするため
    answer: 1
    explanation: 直す前に失敗することを確かめておけば、そのテストがバグを捉えていると分かります。直したあとはテストが通り、同じバグが戻ってきたら気づけます。
  - question: "Swift Testing の `@Test(\"端数は切り捨てる\", arguments: [(1250, 12), (1299, 12)])` のように arguments を使う利点はどれですか？"
    choices:
      - テストが速くなる
      - 同じ確かめ方を値を変えて書け、値ごとに別のテストとして結果が表示されるので、どの値で失敗したかすぐ分かる
      - テストが失敗しなくなる
      - async のテストが書けるようになる
    answer: 1
    explanation: arguments の値ごとに別のテストとして実行されます。似たテストを何度も書かずに済み、失敗した値もすぐに分かります。
