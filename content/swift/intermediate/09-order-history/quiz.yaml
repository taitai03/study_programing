questions:
  - question: 注文履歴の画面で、「0件」と「読み込みに失敗した」を同じ表示（何も出さない）にしてはいけない理由はどれですか？
    choices:
      - 画面がさびしくなるから
      - ユーザーにとって「注文していない」と「見られない」は意味が違い、失敗なら再読み込みなどの次の行動が必要だから
      - App Store の審査に通らないから
      - テストが書けないから
    answer: 1
    explanation: 状態ごとに意味が違うので、表示も分けます。失敗のときは理由と「もう一度読み込む」を出して、ユーザーが次に何をすればいいか分かるようにします。
  - question: 「月ごとにまとめる」「日時を表示用の文字列にする」処理を ViewModel に書く理由として、最も適切なものはどれですか？
    choices:
      - View では日付を扱えないから
      - テストで確かめられ（このアプリでは Linux でも）、ほかの画面でも同じ処理を使えるから
      - ViewModel のほうが表示が速いから
      - SwiftUI の決まりだから
    answer: 1
    explanation: 表示のための計算もロジックです。ViewModel に置けば、タイムゾーンの境目などをテストで確かめられます。
  - question: テストで「失敗したあと、もう一度読み込むと成功する」を確かめるための偽物の API として、適切なものはどれですか？
    choices:
      - 本物のサーバーにつなぐ
      - 結果をあとから差し替えられる偽物（actor など）を作り、1回目は失敗、2回目は成功を返す
      - 必ず失敗する偽物だけを使う
      - テストでは確かめられない
    answer: 1
    explanation: 偽物の API の結果を途中で変えられるようにすれば、再読み込みの流れも本物のサーバーなしで確かめられます。
