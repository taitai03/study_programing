questions:
  - question: "`let name = try? validName(input)` と書くと、エラーのときはどうなりますか？"
    choices:
      - アプリが落ちる
      - name が nil になり、エラーの理由は分からなくなる
      - エラーが呼び出し元に伝わる
      - コンパイルエラーになる
    answer: 1
    explanation: "`try?` はエラーを nil に変えます。手軽ですが、なぜ失敗したかが失われるので、ユーザーに理由を伝える場面では do-catch を使います。"
  - question: エラーの enum を `LocalizedError` に準拠させ、`errorDescription` を書く主な目的はどれですか？
    choices:
      - エラーを速く投げるため
      - ユーザーに見せるメッセージを、エラー自身に持たせるため
      - エラーを無視できるようにするため
      - Equatable にするため
    answer: 1
    explanation: errorDescription を書くと、`error.localizedDescription` でもそのメッセージが得られます。画面は、エラーの種類を知らなくてもメッセージを表示できます。
  - question: 「入力欄の下に、項目ごとのエラーを表示する」ときの入力チェックとして適切なものはどれですか？
    choices:
      - 最初のエラーで止めて、そのエラーだけを表示する
      - すべての入力欄を確かめて、入力欄ごとのエラーを集める
      - エラーを表示しない
      - すべてのエラーを1つの文につなげて表示する
    answer: 1
    explanation: 最初のエラーで止めると、1つ直すたびに次のエラーが出て、ユーザーが何度もやり直すことになります。入力欄の下に出すときは、全部を確かめて集めます。
