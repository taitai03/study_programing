questions:
  - question: 「お気に入りの最後の1件だけが、再起動すると消える」という報告から、最初に疑うべきこととして適切なものはどれですか？
    choices:
      - 保存の処理がまったく動いていない
      - 保存するタイミング（状態を変える前に保存していないか）
      - 端末の容量が足りない
      - 商品のIDが重複している
    answer: 1
    explanation: 全部消えるなら保存か読み込みが動いていないことを疑いますが、最後の1件だけなら、保存されるのが「1つ前の状態」になっている、つまりタイミングのずれが疑わしいです。
  - question: 保存先を `KeyValueStore` プロトコルにしておくと、テストで何ができますか？
    choices:
      - UserDefaults を速くできる
      - メモリ上の保存先を使って、同じ保存先から作り直すことで「アプリの再起動」をテストで再現できる
      - 保存が不要になる
      - 画面のテストができる
    answer: 1
    explanation: 保存先を差し替えられるので、テストではメモリ上の保存先を使えます。同じ保存先からオブジェクトを作り直せば、再起動したときの動きを確かめられます。
  - question: Xcode のブレークポイントで止まっているときに、デバッグコンソールで変数の値を表示するコマンドはどれですか？
    choices:
      - "`po 変数名`"
      - "`print 変数名`（Swift のコードとして書く）"
      - "`git log`"
      - "`swift test`"
    answer: 0
    explanation: "`po`（print object）で、止まっている時点の変数や式の値を表示できます。"
