ticket: |
  ## 背景

  アプリのレビューと問い合わせ（CS-2210）に、次のような声が届いています。

  > お気に入りに入れた商品が、アプリを閉じて開き直すと消えていることがあります。全部ではなく、最後に入れたものが消えているようです。外したはずの商品が、また入っていることもあります。

  3月のアップデート（お気に入りの上限を追加したもの）のあとから、問い合わせが増えています。

  ## やること

  - 問い合わせの現象を再現し、**原因** を調べる
  - 原因を直す（お気に入りの上限100件の仕様は残す）
  - 同じバグが再発しないように、テストを追加する

  ## 受け入れ条件

  - [ ] お気に入りに入れた・外した状態が、アプリを再起動しても残る
  - [ ] お気に入りの上限（100件）はいままでどおり
  - [ ] 再発防止のテストを追加している
  - [ ] PRの説明に、原因と直し方を書いている
  - [ ] 既存のテストがすべて通る

  ## 参考

  - お気に入り: `SakuraMartKit/Sources/SakuraMartKit/FavoritesStore.swift`、保存先: `KeyValueStore.swift`
  - テスト: `SakuraMartKit/Tests/SakuraMartKitTests/Tasks/FavoritesStoreTaskTests.swift`
hints:
  - |
    まず、`InMemoryKeyValueStore` を使って「お気に入りに入れる → 同じ保存先から FavoritesStore を作り直す」テストを書き、どの操作のあとで食い違うかを確かめましょう。
  - |
    「最後に入れたものだけが消える」がヒントです。`toggle` の中で、お気に入りを変える処理と保存する処理が、どの順番で実行されているかを確かめましょう。
  - |
    `save()` は、そのときの `productIDs` を保存します。保存されるのは、変える前の状態でしょうか、変えたあとの状態でしょうか？
