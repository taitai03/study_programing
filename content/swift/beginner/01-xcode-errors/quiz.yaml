questions:
  - question: "Playground で実行したら `cannot find 'shipingFee' in scope` というエラーが出ました。最初に確認すべきことはどれですか？"
    choices:
      - Xcode を再インストールする
      - エラーの行の `shipingFee` のつづりが、定義した名前と合っているか
      - インターネットで見つけたコードを貼り付ける
      - Mac を再起動する
    answer: 1
    explanation: "`cannot find ... in scope` は「その名前が見つからない」という意味です。まずタイプミスがないか、定義（`let shippingFee = ...`）と見比べます。"
  - question: "`let fee = 550` のとき、`送料: 550円` と表示するコードはどれですか？"
    choices:
      - "`print(\"送料: \" + fee + \"円\")`"
      - "`print(\"送料: \\(fee)円\")`"
      - "`print(\"送料: fee円\")`"
      - "`print(送料: fee円)`"
    answer: 1
    explanation: "Swift では文字列と数値を `+` でつなげません。文字列の中に `\\( )` を書くと、値を埋め込めます。"
  - question: Swift のコンパイルエラーについての説明で、正しいものはどれですか？
    choices:
      - 実行している途中で、エラーの行に来たときに初めて表示される
      - 実行する前にコード全体がチェックされ、エラーがあると実行されない
      - エラーがあっても、エラーのない行だけは実行される
      - "Xcode の「Fix」を押せば、内容を確認しなくても必ず正しく直る"
    answer: 1
    explanation: Swift は実行する前にコード全体をチェック（コンパイル）します。エラーが1つでもあると実行されないので、上から順に直していきます。Fix-it を使ったときも、何が変わったかを確認しましょう。
