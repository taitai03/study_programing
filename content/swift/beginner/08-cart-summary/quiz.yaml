questions:
  - question: シルバー会員の小計2,100円の注文に「500円引き・2,000円以上」のクーポンを使おうとしました。さくらマートのルールではどうなりますか？
    choices:
      - 小計が2,000円以上なので、クーポンが使える
      - ランク割引のあとの金額（1,995円）で判定するので、クーポンは使えない
      - クーポンを先に使ってから、ランク割引をする
      - シルバー会員はクーポンを使えない
    answer: 1
    explanation: "料金計算は「小計 → ランク割引 → クーポン → 消費税 → 送料」の順番です。最低購入金額は、ランク割引のあとの金額（2,100 − 105 = 1,995円）で判定します。"
  - question: "自分で作った struct を `==` で比べられるようにするには、どうしますか？"
    choices:
      - "何もしなくても比べられる"
      - "型の名前のあとに `: Equatable` と書く"
      - "class に書き換える"
      - "プロパティをすべて `var` にする"
    answer: 1
    explanation: "`Equatable` に準拠させると、すべてのプロパティが同じかどうかで `==` が使えるようになります。プロパティがすべて Equatable な型（Int など）なら、自動で用意されます。"
  - question: 送料無料の判定（5,000円以上）に使う金額はどれですか？
    choices:
      - 小計（税抜・割引前）
      - ランク割引のあとの金額
      - 割引のあとの金額に消費税を加えた金額
      - 送料を含めた合計
    answer: 2
    explanation: "送料無料は「消費税を加えた金額が5,000円以上」で判定します。判定に使う金額を間違えると、境目の注文で送料が変わってしまいます。"
