questions:
  - question: "`let total = 0` と書いたあと、`total += 500` を実行するとどうなりますか？"
    choices:
      - "`total` が 500 になる"
      - "`let` で作った定数は変えられないので、コンパイルエラーになる"
      - "`total` は 0 のまま、警告だけ出る"
      - 実行したときに初めてエラーになる
    answer: 1
    explanation: "`let` は定数なので、あとから値を変えられません。値を変えたいときは `var` で作ります。Swift は実行する前にこの間違いを見つけてくれます。"
  - question: "`let price = 398` と書いたとき、`price` の型はどれですか？"
    choices:
      - "`Double`"
      - "`Int`"
      - "`String`"
      - 型は決まらない
    answer: 1
    explanation: 型を書かなくても、Swift が値から型を決めます（型推論）。小数点のない数値は `Int` になります。
  - question: "`let totalWithTax = 1194 * 110 / 100` の値はどれですか？"
    choices:
      - "`1313.4`"
      - "`1313`"
      - "`1314`"
      - "`1210`"
    answer: 1
    explanation: "`Int` どうしの割り算は、小数点以下が切り捨てられます。131340 / 100 は 1313 になります。"
