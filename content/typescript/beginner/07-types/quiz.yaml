questions:
  - question: 型エラーが出ているコードについて、正しい考え方はどれですか？
    choices:
      - 実行できるなら、型エラーは無視してよい
      - 型エラーは実行する前に見つかったバグなので、直してからリリースする
      - 型を消せば型エラーは出なくなるので、型を消す
      - 型エラーはTypeScriptの不具合なので、気にしなくてよい
    answer: 1
    explanation: 型エラーは、本番で動かす前にバグを教えてくれています。現場では、型エラーが残ったコードはリリースしません。
  - question: "`type Status = \"paid\" | \"shipped\";` のとき、`const s: Status = \"canceled\";` はどうなりますか？"
    choices:
      - 問題なく動く
      - 型エラーになる（\"canceled\" は Status ではない）
      - "s に \"paid\" が入る"
      - 実行したときだけエラーになる
    answer: 1
    explanation: ユニオン型は「このどれか」という型です。並べた値以外を入れようとすると、実行する前に型エラーになります。
  - question: "`couponCode?: string` と定義されたプロパティを使うときに注意することは何ですか？"
    choices:
      - 必ず数値に変換してから使う
      - 値がない（undefined）場合があるので、その場合の処理を先に書く
      - 必ず大文字で書く
      - 特に注意することはない
    answer: 1
    explanation: "`?` が付いたプロパティは、値がないことがあります。値がないときの処理を書いておかないと、実行時にエラーになります。"
