questions:
  - question: 仕様書から大きめの関数を作るとき、最初にやるとよいことはどれですか？
    choices:
      - とにかく全部を1つの関数に書き始める
      - 入力と出力を確認し、仕様書の条件を漏れなく箇条書きにする
      - 似たコードをインターネットで探して貼り付ける
      - 画面のデザインを考える
    answer: 1
    explanation: 何を受け取って何を返すか、どんな条件があるかを先に整理すると、書き漏れや手戻りが減ります。
  - question: "`items.sort((a, b) => b.quantity - a.quantity)` は、どのように並べ替えますか？"
    choices:
      - quantity の小さい順
      - quantity の大きい順
      - 商品名の順
      - 並べ替えない
    answer: 1
    explanation: "`b - a` は大きい順、`a - b` は小さい順です。値が同じものは、もとの順番のままになります。"
  - question: 「キャンセルの注文は集計に含めない」という仕様があるとき、確かめておくべきことはどれですか？
    choices:
      - 件数だけキャンセルを除けばよい
      - 件数・売上・ランキングなど、すべての項目でキャンセルが除かれているか
      - キャンセルの注文が1件もないデータで確かめれば十分
      - 確かめなくてよい
    answer: 1
    explanation: 一部の項目だけキャンセルを除き忘れると、件数と売上が合わないなどの不具合になります。すべての項目で確かめましょう。
