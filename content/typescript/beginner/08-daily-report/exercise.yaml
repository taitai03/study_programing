ticket: |
  ## 背景
  店長から「毎日の閉店後に、その日の売上の要点を1画面で見たい」と依頼がありました。
  画面は別の担当者が作るので、あなたは注文データからレポートの数字を作る関数を担当します。

  ## 仕様書
  関数 `createDailyReport(orders: Order[]): DailyReport` を作る。型（`Order`、`DailyReport` など）はエディタに定義済み。

  | 項目 | 内容 |
  | --- | --- |
  | `orderCount` | 注文の件数 |
  | `sales` | 売上。各注文の小計（単価 × 数量の合計、税抜）の合計 |
  | `averageOrderValue` | 1注文あたりの平均金額。`sales ÷ orderCount`（端数は切り捨て）。注文が0件なら 0 |
  | `topProducts` | 商品別の販売数ランキング。販売数の多い順に、最大3商品 |

  - キャンセル（`status` が `"cancelled"`）の注文は、**すべての項目で** 集計に含めない
  - ランキングで販売数が同じ商品は、注文データに先に出てきた商品を上にする
  - 注文が0件のときは、件数・売上・平均は 0、ランキングは空の配列

  ## 受け入れ条件
  - [ ] 今日の注文（`todayOrders`）の件数が 4 件になる（キャンセルを除く）
  - [ ] 今日の売上が 6,652 円になる
  - [ ] 今日の1注文あたりの平均金額が 1,663 円になる
  - [ ] 今日のランキングが「天然水 2L（10個）」「国産りんごジュース 1L（4個）」「ふっくら食パン（3個）」になる
  - [ ] 販売数が同じ商品は、先に出てきた商品が上になる
  - [ ] 注文が0件のときは、0 と空のランキングになる
