solution: |
  type Product = {
    id: number;
    name: string;
    price: number; // 税抜
    category: string;
    stock: number;
    published: boolean;
  };

  const products: Product[] = [
    { id: 1, name: "国産りんごジュース 1L", price: 398, category: "飲料", stock: 12, published: true },
    { id: 2, name: "ふっくら食パン", price: 248, category: "食品", stock: 0, published: true },
    { id: 3, name: "竹のまな板", price: 1980, category: "キッチン用品", stock: 5, published: true },
    { id: 4, name: "有機緑茶 500ml", price: 158, category: "飲料", stock: 0, published: true },
    { id: 5, name: "季節のギフトセット", price: 3980, category: "ギフト", stock: 0, published: false },
    { id: 6, name: "ボールペン 3本セット", price: 330, category: "文具", stock: 40, published: true },
    { id: 7, name: "天然水 2L", price: 128, category: "飲料", stock: 30, published: true },
    { id: 8, name: "食器用スポンジ", price: 198, category: "日用品", stock: 0, published: true },
  ];

  function findOutOfStockNames(products: Product[]): string[] {
    const names: string[] = [];
    for (const product of products) {
      if (product.published && product.stock === 0) {
        names.push(product.name);
      }
    }
    return names;
  }

  function countByCategory(products: Product[]): Record<string, number> {
    const counts: Record<string, number> = {};
    for (const product of products) {
      if (!product.published) continue;
      counts[product.category] = (counts[product.category] ?? 0) + 1;
    }
    return counts;
  }

  function calcInventoryValue(products: Product[]): number {
    let total = 0;
    for (const product of products) {
      total += product.price * product.stock;
    }
    return total;
  }
tests:
  - name: 在庫切れの商品名が並び順のまま返る
    code: |
      expect(findOutOfStockNames(products)).toEqual(["ふっくら食パン", "有機緑茶 500ml", "食器用スポンジ"]);
  - name: 非公開の商品は在庫切れの一覧に含まれない
    code: |
      expect(findOutOfStockNames(products).includes("季節のギフトセット")).toBe(false);
  - name: カテゴリごとの公開中の商品数が正しい
    code: |
      expect(countByCategory(products)).toEqual({ "飲料": 3, "食品": 1, "キッチン用品": 1, "文具": 1, "日用品": 1 });
  - name: 在庫金額の合計が 31,716 円になる
    code: |
      expect(calcInventoryValue(products)).toBe(31716);
  - name: 商品が0件のときは、空の配列・空のオブジェクト・0 を返す
    code: |
      expect(findOutOfStockNames([])).toEqual([]);
      expect(countByCategory([])).toEqual({});
      expect(calcInventoryValue([])).toBe(0);
hints:
  - 解説の「よく使うデータ処理のパターン」の2つ（抜き出す、種類ごとに数える）がそのまま使えます。
  - "公開中かどうかは `product.published` で分かります。「公開中かつ在庫0」は `&&` で組み合わせます。"
  - 繰り返しの中で、ある商品を飛ばしたいときは `continue;` と書くと、次の商品に進みます。
