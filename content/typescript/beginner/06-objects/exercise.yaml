ticket: |
  ## 背景
  在庫担当から、毎朝の発注作業のために次の3つを知りたいと依頼がありました。
  商品データ（`products`）は、管理システムから出力したものです。

  ## やること
  1. `findOutOfStockNames`: 在庫切れの商品名の一覧を返す
     - **公開中**（`published` が `true`）で、在庫が0の商品だけを対象にする（非公開の商品は売っていないので対象外）
     - 商品データの並び順のまま返す
  2. `countByCategory`: 公開中の商品の数を、カテゴリごとに数えて返す
     - 例: `{ "飲料": 3, "食品": 1 }`
  3. `calcInventoryValue`: 在庫金額（価格 × 在庫数）の合計を返す
     - 公開・非公開に関係なく、すべての商品を対象にする

  ## 受け入れ条件
  - [ ] 在庫切れの商品名が「ふっくら食パン」「有機緑茶 500ml」「食器用スポンジ」の順で返る
  - [ ] 非公開の商品（季節のギフトセット）は在庫切れの一覧に含まれない
  - [ ] カテゴリごとの公開中の商品数が正しい（飲料3、食品1、キッチン用品1、文具1、日用品1）
  - [ ] 在庫金額の合計が 31,716 円になる
  - [ ] 商品が0件のときは、空の配列・空のオブジェクト・0 を返す
