questions:
  - question: 「購入金額が3,000円を超えたらクーポンを使える」というルールを正しく表している条件はどれですか？
    choices:
      - "`total >= 3000`"
      - "`total > 3000`"
      - "`total = 3000`"
      - "`total <= 3000`"
    answer: 1
    explanation: 「超える」は、その値を含みません。ちょうど3,000円は対象外なので `>` を使います。「以上」なら `>=` です。
  - question: 「ゴールド会員、またはシルバー会員なら送料無料」を表す条件はどれですか？
    choices:
      - "`rank === \"gold\" && rank === \"silver\"`"
      - "`rank === \"gold\" || rank === \"silver\"`"
      - "`rank = \"gold\" || \"silver\"`"
      - "`!rank`"
    answer: 1
    explanation: 「または」は `||` です。`&&` だと「ゴールドでもありシルバーでもある」という、ありえない条件になってしまいます。
  - question: 条件分岐を書いたあと、特に確かめるべき値はどれですか？
    choices:
      - 一番よく使われる値だけ
      - 'ルールの境目の値（例: 4,999円と5,000円）'
      - とても大きな値だけ
      - 確かめなくてよい
    answer: 1
    explanation: "`>` と `>=` の間違いなど、条件分岐のバグは境目で起きます。境目の両側の値で確かめるのが基本です。"
