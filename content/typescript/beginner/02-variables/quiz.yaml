questions:
  - question: 次のうち、現場でのおすすめの書き方はどれですか？
    choices:
      - すべての変数を `let` で作る
      - 基本は `const` を使い、値を変える必要があるときだけ `let` を使う
      - 変数は使わず、数値を直接書く
      - 変数名は短いほうがよいので `a` や `b` にする
    answer: 1
    explanation: 値が途中で変わらない `const` を基本にすると、読む人が「この値はどこかで書き換わるかも」と心配せずに済みます。
  - question: 税抜 2,980円の商品の税込金額（消費税10%、切り捨て）を求めるコードとして、最も適切なのはどれですか？
    choices:
      - "`2980 * 1.1`"
      - "`Math.floor(2980 * 1.1)`"
      - "`Math.floor((2980 * 110) / 100)`"
      - "`2980 + 10`"
    answer: 2
    explanation: 小数の計算には誤差が出ることがあるので、お金は整数で計算します。110を掛けて100で割り、`Math.floor` で切り捨てます。
  - question: "`const name = \"さくら\"; console.log(`こんにちは、${name}さん`);` の出力はどれですか？"
    choices:
      - "`こんにちは、${name}さん`"
      - "`こんにちは、さくらさん`"
      - "`こんにちは、nameさん`"
      - エラーになる
    answer: 1
    explanation: バッククォートで囲んだ文字列（テンプレートリテラル）では、`${...}` の部分に変数の値が埋め込まれます。
