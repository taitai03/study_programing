questions:
  - question: "`ReferenceError: totl is not defined（5行目）` というエラーが出ました。最初に確認すべきことはどれですか？"
    choices:
      - プログラムを最初から書き直す
      - 5行目の `totl` のつづりが、定義した名前と合っているか
      - インターネットで「ReferenceError」を調べて、出てきたコードを貼り付ける
      - エラーは気にせず、もう一度実行する
    answer: 1
    explanation: エラーメッセージは「どこで（5行目）」「何が（totl が定義されていない）」を教えてくれます。まずその場所を見て、名前のタイプミスがないか確認します。
  - question: 次のコードを実行したとき、出力はどうなりますか？ `console.log("合計"); console.log(300 + 200);`
    choices:
      - "`合計` と `500` が順に表示される"
      - "`合計500` と1行で表示される"
      - "`500` と `合計` が順に表示される"
      - "`合計` と `300 + 200` が順に表示される"
    answer: 0
    explanation: プログラムは上から順に実行されます。`"` で囲まない `300 + 200` は数値として計算されるので `500` が表示されます。
  - question: エディタで、コードに赤い波線が引かれました。どう対応するのがよいですか？
    choices:
      - 実行すれば消えるので無視する
      - 波線にマウスを乗せて理由を読み、直す
      - 波線が引かれた行を削除する
      - エディタを再読み込みする
    answer: 1
    explanation: 赤い波線は、TypeScriptが実行前に見つけた問題です。理由を読めば、実行する前にバグを直せます。
