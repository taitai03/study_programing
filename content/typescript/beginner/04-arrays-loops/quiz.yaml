questions:
  - question: "`const items = [\"りんご\", \"みかん\", \"ぶどう\"];` のとき、`items[1]` の値はどれですか？"
    choices:
      - "`りんご`"
      - "`みかん`"
      - "`ぶどう`"
      - エラーになる
    answer: 1
    explanation: 配列の番号は0から数えます。`items[0]` が「りんご」、`items[1]` が「みかん」です。
  - question: 合計を求めるとき、合計用の変数を `let` で作るのはなぜですか？
    choices:
      - "`const` よりも速いから"
      - 繰り返しの中で値を足していき、値が変わるから
      - "`let` でないと配列を使えないから"
      - 特に理由はない
    answer: 1
    explanation: 合計の変数は繰り返しのたびに値が変わります。値を書き換えるので `let` を使います。
  - question: 注文を集計する関数を作るとき、必ず考えるべきケースはどれですか？
    choices:
      - 注文が1件もない（空の配列）とき
      - 注文が100万件あるとき
      - 注文金額がすべて同じとき
      - 特にない
    answer: 0
    explanation: データが0件のときの動きは、業務でよく問題になります。空の配列でも正しい結果（またはエラーにならない結果）になるかを必ず確かめます。
