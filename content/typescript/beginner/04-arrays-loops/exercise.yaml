ticket: |
  ## 背景
  店長から「毎日の売上の状況をすぐに知りたい」と依頼がありました。
  まずは、1日の注文金額（税込）の一覧から、基本的な数字を出す関数を作ります。

  ## やること
  1. `sumTotals`: 注文金額の合計を返す
  2. `countLargeOrders`: 指定した金額（`threshold`）以上の注文の件数を返す
  3. `maxTotal`: 一番大きい注文金額を返す

  注文が1件もない（空の配列の）場合は、どれも 0 を返してください。

  ## 受け入れ条件
  - [ ] 今日の注文（`todayOrderTotals`）の合計が 23,960 になる
  - [ ] 今日の注文のうち5,000円以上の注文は 2 件
  - [ ] 今日の注文の最大金額は 12,800
  - [ ] 空の配列では、合計・件数・最大金額がすべて 0 になる
