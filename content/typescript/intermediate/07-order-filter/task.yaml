ticket: |
  ## 背景

  CSチームが使う社内ツールから、スタッフ向けの注文一覧API（`GET /api/orders`）を呼んでいます。「特定の期間の注文だけ」「支払済の注文だけ」を見たいという要望が来ました。

  ## やること

  `GET /api/orders` に、期間とステータスの絞り込みを追加する。いまの機能（新しい順、`page` で50件ずつ）はそのまま使えるようにする。

  | クエリ | 内容 |
  | --- | --- |
  | `from` | この日（日本時間、`YYYY-MM-DD`）以降に作成された注文 |
  | `to` | この日（日本時間、`YYYY-MM-DD`）までに作成された注文（その日の終わりまで含む） |
  | `status` | このステータスの注文（`pending` / `paid` / `shipped` / `completed` / `cancelled`） |

  - それぞれ省略できる。組み合わせたときは、すべての条件に合う注文
  - 正しくない値のときは 400 で、理由を `{ "error": "…" }` で返す
    - 日付の形式が `YYYY-MM-DD` でない、存在しない日付（`2026-02-30` など）
    - `from` が `to` より後
    - 知らないステータス

  ## 受け入れ条件

  - [ ] `status` で絞り込める
  - [ ] `from` と `to` で、その期間（両端の日を含む）に作成された注文だけを返す。日付の区切りは日本時間の0時
  - [ ] `from` だけ、`to` だけでも絞り込める。`status` と組み合わせられる
  - [ ] 絞り込んだ結果も、`page` で次のページを取れる
  - [ ] 正しくない値は 400 で、理由をメッセージで返す
  - [ ] 既存のテストと型チェックがすべて通る

  ## 参考

  - テスト: `src/app/api/orders/filter.task.test.ts`
  - Drizzle: Filters https://orm.drizzle.team/docs/operators
hints:
  - |
    クエリは `Object.fromEntries(new URL(request.url).searchParams)` でオブジェクトにでき、zod のスキーマで確かめられます。日付は `new Date(`${value}T00:00:00+09:00`)` で日本時間の0時になります。
  - |
    `listOrders`（`src/lib/orders.ts`）に絞り込みの条件を受け取れるようにして、条件の配列を `and(...)` でまとめると、管理画面からも同じ関数を使えます。
  - |
    「to の日を含む」は、`createdAt < (to の翌日の0時)` で書けます。存在しない日付は、Date にしたあとで日付の文字列に戻し、元の値と同じかで確かめます。
