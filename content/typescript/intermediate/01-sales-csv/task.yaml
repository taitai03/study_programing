hints:
  - |
    まずテストを実行して、どのテストが何を期待しているかを読みましょう。`npx vitest src/reports` を実行したままにしておくと、保存するたびに自動で再実行されます。
  - |
    `csv-parse` の `parse(text, { skip_empty_lines: true, relax_column_count: true })` は、各行を文字列の配列にして返します。`relax_column_count` を付けると、列の数が合わない行でもエラーにならずに読めるので、自分で行番号付きのエラーを出せます。
  - |
    日本時間の年月は、UTC の時刻に9時間足してから `toISOString().slice(0, 7)` で取り出せます。
