questions:
  - question: 注文明細の配列から、キャンセル以外の売上合計を出したいとき、メソッドを使う順番として自然なものはどれですか？
    choices:
      - "`reduce` → `filter` → `map`"
      - "`filter` → `map` → `reduce`"
      - "`map` → `reduce` → `filter`"
      - "`sort` → `reduce`"
    answer: 1
    explanation: まず `filter` でキャンセルを除き、`map` で明細を金額に変え、最後に `reduce` で1つの合計にまとめます。
  - question: "`2026-03-31T15:30:00Z` の注文は、日本時間の月別の集計ではどの月に入りますか？"
    choices:
      - 2026年3月
      - 2026年4月
      - タイムゾーンの指定がないので決められない
      - 2026年2月
    answer: 1
    explanation: "末尾の Z は UTC です。日本時間は UTC＋9時間なので、4月1日の0時30分になり、4月に入ります。"
  - question: CSV の各行を `line.split(",")` で分けると、どんな問題がありますか？
    choices:
      - 処理が遅くなるだけで、結果は正しい
      - 値にカンマが含まれる（ダブルクォートで囲まれた）とき、1つの値が2つに分かれてしまう
      - 数値が自動で文字列になる
      - 問題はない
    answer: 1
    explanation: CSV では、カンマや改行を含む値はダブルクォートで囲むルールがあります。split ではこれを扱えないので、CSV のパッケージを使います。
