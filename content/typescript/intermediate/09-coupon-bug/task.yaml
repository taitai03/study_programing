ticket: |
  ## 背景

  CSチームから問い合わせ（CS-1188）が来ています。

  > 会員の方から「500円引きのクーポン（WELCOME500）を使ったら、1,000円引かれていた。得をしたけれど、間違いではないか」と連絡がありました。ほかにもクーポンを使った注文で、合計金額が明細と合わないものがいくつかあります。

  経理からも「クーポンを使った注文の売上が、計算と合わない」と言われています。

  ## やること

  - 問い合わせの現象を手元で再現し、**原因** を調べる
  - 原因を直す
  - 同じバグが再発しないように、テストを追加する

  ## 受け入れ条件

  - [ ] クーポンを使った注文の合計が、料金計算のルール（README の「業務のルール」）どおりになる。クーポンの割引は1回だけ適用される
  - [ ] クーポンを使わない注文の金額は、いままでと変わらない
  - [ ] 再発防止のテストを追加している
  - [ ] PRの説明に、原因と直し方を書いている
  - [ ] 既存のテストと型チェックがすべて通る

  ## 参考

  - 料金計算: `src/lib/pricing.ts`、注文の作成: `src/lib/orders.ts`
  - `git log -p` で、関係するファイルの変更の履歴を見られます
hints:
  - |
    まず、クーポンを使った注文を作るテストを書いて、`subtotal - rankDiscount - couponDiscount + tax + shippingFee` と `total` が一致するかを確かめましょう。会員向けの注文API（README の curl の例）で、実際に注文を作ってみるのも手です。
  - |
    `createOrder` から、金額を計算しているところをたどります。`calculateOrder` の結果は正しいでしょうか？ そのあと、保存するまでの間に金額が変わっていないでしょうか？
  - |
    `src/lib/order-totals.ts` のコメントにある「合計がクーポンの分だけ高い」という問い合わせは、本当に `calculateOrder` の不具合だったのでしょうか。`calculateOrder` の中で、クーポン割引がどう扱われているかを読んでみましょう。
