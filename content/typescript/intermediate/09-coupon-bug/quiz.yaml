questions:
  - question: バグの報告を受けたとき、最初にするべきことはどれですか？
    choices:
      - 怪しそうなコードをすぐに書き換える
      - 手元で同じ現象を再現できるかを確かめる
      - 報告した人に、もう一度試してもらう
      - 関係しそうなファイルを全部、頭から読む
    answer: 1
    explanation: 再現できれば、原因を調べる手がかりになり、直ったかどうかも同じ手順で確かめられます。再現の手順はテストとして残すと、再発も防げます。
  - question: 合計金額が500円安すぎるバグを、「合計に500円足す」処理を加えて直すのがよくない理由はどれですか？
    choices:
      - 処理が遅くなるから
      - 原因が残ったままなので、条件が変わると（別のクーポンなど）新しいバグになるから
      - 500円という数字が分かりにくいから
      - テストが書けないから
    answer: 1
    explanation: つじつま合わせでは原因が直っていません。定率のクーポンなど、別の条件では金額がずれます。原因の場所を直します。
  - question: ある行が「いつ、なぜ」書かれたのかを調べるのに役立つものはどれですか？
    choices:
      - "`git blame` や `git log -p` で、その行を変更したコミットとメッセージを見る"
      - "`npm install` をやり直す"
      - "`console.log` を足す"
      - ブレークポイントを置く
    answer: 0
    explanation: git の履歴から、その行を変えたコミット、メッセージ、関連するチケット番号が分かります。変更の意図を知る手がかりになります。
