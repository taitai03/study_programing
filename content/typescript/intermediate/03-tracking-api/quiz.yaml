questions:
  - question: 1件 300ms かかるAPIを、10件分 `for` 文の中で1件ずつ `await` すると、全体でおよそ何秒かかりますか？
    choices:
      - 0.3秒
      - 3秒
      - 30秒
      - 並列で動くので 0.03秒
    answer: 1
    explanation: 1件ずつ待つので、300ms × 10件 = 3秒です。`Promise.all` でまとめて待てば、一番遅い1件の時間（約0.3秒）で終わります。
  - question: 追跡APIが 404（見つからない）を返したとき、やり直さないほうがよい理由はどれですか？
    choices:
      - 404 は一時的なエラーなので、すぐ直るから
      - 何度問い合わせても結果は変わらず、相手のAPIに無駄な負荷をかけるだけだから
      - 404 はタイムアウトと同じだから
      - やり直すと料金がかかるから
    answer: 1
    explanation: 404 は「その追跡番号はない」という答えです。やり直しても変わらないので、すぐに not_found として返します。
  - question: "`Promise.all` に渡した Promise のうち1つが失敗（reject）すると、どうなりますか？"
    choices:
      - 失敗したものだけが null になり、ほかは成功の結果が返る
      - "`Promise.all` 全体が失敗になる"
      - 失敗したものを自動でやり直す
      - 何も起きない
    answer: 1
    explanation: "`Promise.all` は1つでも失敗すると全体が失敗になります。1件の失敗をほかに影響させたくないときは、1件ごとに例外を受け止めて結果の値にするか、`Promise.allSettled` を使います。"
