questions:
  - question: 画面の選択肢で「発送済 → 受付」を選べなくしていれば、サーバー側のチェックは不要ですか？
    choices:
      - 不要。画面で選べないので、その変更は起きない
      - 必要。画面は改造でき、Server Action も直接呼び出せるので、業務のルールはサーバーで守る
      - 本番環境だけ必要
      - 管理者が使う画面なら不要
    answer: 1
    explanation: 画面で選択肢を絞るのは使いやすさのためです。リクエストは改造できるので、正しさはサーバー側のチェックで守ります。
  - question: ステータスの変更とポイントの取り消しを、トランザクションの中で行う理由はどれですか？
    choices:
      - 処理が速くなるから
      - 途中で失敗したときに、両方とも取り消され、片方だけ変わった状態が残らないから
      - トランザクションを使わないとDBに書き込めないから
      - ログが残るから
    answer: 1
    explanation: トランザクションの中の変更は、全部成功するか、全部取り消されるかのどちらかです。データの食い違いを防げます。
  - question: 送信ボタンを、送信中は押せなくする（disabled）主な理由はどれですか？
    choices:
      - 見た目をよくするため
      - 二重に送信されて、同じ処理が2回実行されるのを防ぐため
      - サーバーの負荷を測るため
      - ボタンの色を変えるため
    answer: 1
    explanation: 応答を待っている間にもう一度押されると、同じ変更が2回送られます。押せなくし、「変更中…」と表示して状況を伝えます。
