questions:
  - question: "`schema.ts` に列を追加したあと、マイグレーションのファイル（drizzle/）を commit し忘れると、何が起きますか？"
    choices:
      - 何も起きない。schema.ts から自動で列ができる
      - 自分の手元では動くが、ほかの人やCIのDBには列がなく、テストやアプリが失敗する
      - schema.ts の変更が取り消される
      - ビルドが速くなる
    answer: 1
    explanation: DBの変更は、マイグレーションのファイルとして共有します。commit し忘れると、ほかの環境では列が作られません。
  - question: 2つの商品を注文し、2つ目の商品の在庫が足りなかったときの正しい動きはどれですか？
    choices:
      - 1つ目の商品だけ注文して、在庫を減らす
      - 何も変えずにエラーにする（1つ目の在庫も減らさない）
      - 在庫をマイナスにして注文する
      - 2つ目の商品の数量を在庫に合わせて減らして注文する
    answer: 1
    explanation: 注文はすべての商品がそろって1つです。足りない商品があれば、トランザクションで何も変えずにエラーにします。
  - question: 仕様書に書かれていないこと（キャンセル時に在庫を戻すか）に気づいたとき、どうするのがよいですか？
    choices:
      - 自分の判断で実装しておく
      - 黙って何もしない
      - 依頼した人に確認する。決まったことは仕様書やPRの説明に残す
      - ほかの機能のコードを全部書き換える
    answer: 2
    explanation: 業務のルールは、勝手に決めると食い違いの原因になります。確認して、決まったことを記録に残します。
