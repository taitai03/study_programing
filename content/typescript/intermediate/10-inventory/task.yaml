ticket: |
  ## 背景

  在庫はいま、倉庫のスタッフが表計算ソフトで管理していて、売り切れた商品にも注文が入ってしまうことがあります。管理画面で在庫を管理できるようにし、在庫が足りない商品は注文できないようにします。

  ## 仕様書

  ### 在庫数

  - 商品に **在庫数**（`products.stock`、整数、`NOT NULL`、既定値 0）を持たせる。マイグレーションを作ること
  - 初期データ（`src/db/seed.ts`）では、各商品の在庫を **300** にしてから注文を作る

  ### 在庫不足

  - 在庫が **10個以下** の商品を「在庫不足」とする

  ### 注文

  - 注文すると、注文した数だけ商品の在庫を減らす
  - 注文の中に在庫が足りない商品が1つでもあれば、`OrderError`（メッセージに「在庫が足りません」と、足りない商品名を含める）にして、注文も在庫も変えない。在庫とちょうど同じ数なら注文できる

  ### 管理画面

  - ナビゲーションに「在庫」を追加し、`/admin/inventory` に在庫の一覧を表示する
    - すべての商品を、在庫の少ない順（同じなら商品IDの小さい順）に、商品名・カテゴリ・在庫数を表示する
    - 在庫不足の商品には「在庫不足」と表示する
    - 商品ごとに、入荷数を入力して在庫を増やせる（入荷登録）。入荷数は 1〜1000 の整数。それ以外はエラーを表示する
  - ダッシュボードに、在庫不足の商品があれば「在庫不足の商品がN件あります」と表示し、在庫の一覧へのリンクを置く

  ### 対象外（今回はやらない）

  - 注文をキャンセルしたときに在庫を戻すこと
  - 入荷の履歴を残すこと

  ### テストが使うインターフェース

  | 場所 | 名前 | 内容 |
  | --- | --- | --- |
  | `src/lib/inventory.ts` | `LOW_STOCK_THRESHOLD` | `10` |
  | 〃 | `isLowStock(stock)` | 在庫不足なら `true` |
  | 〃 | `listInventory(db)` | `{ id, name, category（カテゴリ名）, stock, isLow }` の配列（並び順は上のとおり） |
  | 〃 | `countLowStock(db)` | 在庫不足の商品の数 |
  | 〃 | `receiveStock(db, productId, quantity)` | 在庫を増やし、増やしたあとの在庫数を返す。入荷数が正しくない、商品がないときは `InventoryError` を投げる |
  | 〃 | `InventoryError` | `Error` を継承したクラス |
  | `src/app/admin/inventory/inventory-table.tsx` | `InventoryTable({ items })` | `listInventory` の結果を表として表示する。在庫不足の行に「在庫不足」。商品ごとに「（商品名）の入荷数」というラベルの入力欄と「入荷する」ボタン |
  | `src/app/admin/inventory/actions.ts` | `receiveStockAction` | 入荷登録の Server Action（テストではモックにします） |

  ## 受け入れ条件

  - [ ] 仕様書のとおりに動く（画面でも確認する）
  - [ ] 追加・変更した処理のテストを書いている
  - [ ] PRの説明に、設計で判断したことと、確かめたことを書いている
  - [ ] 既存のテストと型チェックがすべて通る

  ## 参考

  - テスト: `src/lib/inventory.task.test.ts`、`src/app/admin/inventory/inventory-table.task.test.tsx`
  - これまでの課題の画面（商品の編集、注文のステータスの変更）が参考になります
