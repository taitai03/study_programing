questions:
  - question: 画面のフォームで入力チェックをしていても、APIでもう一度チェックする理由はどれですか？
    choices:
      - 画面のチェックは遅いから
      - APIは画面を通さずに直接呼び出せるので、画面のチェックはすり抜けられるから
      - 二重にチェックすると表示が速くなるから
      - 法律で決まっているから
    answer: 1
    explanation: curl などでAPIを直接呼べば、画面のチェックは通りません。サーバーに届いた入力は、必ずサーバーで確かめます。
  - question: DBにつながらないなどの予期しないエラーのとき、APIのレスポンスに含めるべきでないものはどれですか？
    choices:
      - エラーが起きたことを伝えるメッセージ
      - ステータスコード 500
      - エラーの詳細（SQL やスタックトレース）
      - 「時間をおいて試してください」という案内
    answer: 2
    explanation: 詳細は攻撃の手がかりになり、ユーザーにも役に立ちません。詳細はログに出し、ユーザーには次にすべきことを伝えます。
  - question: 登録済みのメールアドレスで会員登録しようとしたときに返すステータスとして、最も適切なものはどれですか？
    choices:
      - 200 OK
      - 404 Not Found
      - 409 Conflict
      - 500 Internal Server Error
    answer: 2
    explanation: 409 Conflict は「すでにあるものと衝突する」ことを表します。500 はサーバーの問題を表すので、入力が原因のエラーには使いません。
