ticket: |
  ## 背景

  会員登録API（`POST /api/members`）に入力チェックがなく、名前が空の会員や、形式の正しくないメールアドレスの会員が登録されています。同じメールアドレスで登録すると 500 エラーにもなります。アプリのチームから「入力欄ごとにエラーを表示したいので、項目ごとのメッセージを返してほしい」と依頼されています。

  ## やること

  `src/app/api/members/route.ts` に入力チェックを追加する。チェックには zod を使う。

  ### 入力の条件

  | 項目 | 条件 |
  | --- | --- |
  | `name` | 必須。前後の空白を取り除いて1〜50文字 |
  | `email` | 必須。前後の空白を取り除き、小文字にしたうえで、メールアドレスの形式（254文字以内） |

  ### レスポンス

  | 状況 | ステータス | 本文 |
  | --- | --- | --- |
  | 登録できた | 201 | いまと同じ（`member` と `apiToken`）。名前とメールアドレスは整えたあとの値 |
  | 入力が条件に合わない | 400 | `{ "error": "入力内容に誤りがあります", "fields": { "name": "…", "email": "…" } }`（問題のある項目だけ） |
  | JSON でないリクエスト | 400 | `{ "error": "…" }` |
  | 登録済みのメールアドレス | 409 | `{ "error": "このメールアドレスはすでに登録されています" }` |
  | 予期しないエラー | 500 | `{ "error": "…" }`（詳細は返さず、ログに出す） |

  ## 受け入れ条件

  - [ ] 正しい入力なら 201 で登録できる。前後の空白は取り除き、メールアドレスは小文字で保存する
  - [ ] 条件に合わない入力は 400 で、問題のある項目ごとのメッセージを `fields` に入れて返す
  - [ ] JSON でないリクエストは 400
  - [ ] 登録済みのメールアドレス（大文字・小文字の違いも同じとみなす）は 409
  - [ ] エラーのときは会員を登録しない
  - [ ] 既存のテストと型チェックがすべて通る

  ## 参考

  - テスト: `src/app/api/members/route.task.test.ts`
  - 注文APIの入力チェック（`src/app/api/orders/route.ts`）
  - zod: https://zod.dev/
hints:
  - |
    `z.object({ name: z.string().trim().min(1, "…").max(50, "…"), ... })` のようにスキーマを書き、`safeParse(body)` で確かめます。メッセージは日本語で、何をどう直せばいいか分かるように書きましょう。
  - |
    `result.error.issues` の各要素の `path[0]` が項目名です。`fields[path[0]] ??= message` のようにすると、項目ごとに最初のメッセージだけを集められます。
  - |
    `await request.json()` は、本文が JSON でないと例外を投げます。`.catch(() => undefined)` で受け止めると、400 を返せます。重複のチェックには `findMemberByEmail`（`src/lib/members.ts`）が使えます。
