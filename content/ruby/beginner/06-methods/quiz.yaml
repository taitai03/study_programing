questions:
  - question: "`def line_total(unit_price, quantity = 1)` と定義したメソッドを `line_total(398)` で呼ぶと、結果はどうなりますか？（中身は `unit_price * quantity`）"
    choices:
      - "`ArgumentError` になる"
      - "`398`"
      - "`0`"
      - "`nil`"
    answer: 1
    explanation: "`quantity = 1` のように値を書いた引数は省略でき、省略すると 1 になります。398 × 1 で 398 です。"
  - question: "`def coupon_discount(amount, type:, value:, min_purchase: 0)` の呼び出しで、エラーになるものはどれですか？"
    choices:
      - "`coupon_discount(3000, type: :amount, value: 500)`"
      - "`coupon_discount(3000, value: 500, type: :amount)`"
      - "`coupon_discount(3000, type: :amount)`"
      - "`coupon_discount(3000, type: :percent, value: 10, min_purchase: 1000)`"
    answer: 2
    explanation: "値を書いていないキーワード引数（`type:` と `value:`）は必須です。`value` を渡さないと `ArgumentError: missing keyword: :value` になります。名前で渡すので順番は入れ替えても問題ありません。"
  - question: 引数が4つある `coupon_discount(3000, :amount, 500, 2000)` を、キーワード引数を使う形に変えるいちばんの理由はどれですか？
    choices:
      - 実行が速くなるから
      - 呼び出す側のコードを読んだだけで、どの値が何を表すか分かるようにするため
      - Rubyでは引数を3つ以上書けないから
      - コードが短くなるから
    answer: 1
    explanation: "`type: :amount, value: 500, min_purchase: 2000` のように名前が付いていると、読む人が仕様と照らし合わせやすくなり、順番の間違いも防げます。"
