questions:
  - question: "`total = 1194 * 110 / 100` を実行したとき、`total` の値はどれですか？"
    choices:
      - "`1313.4`"
      - "`1313`"
      - "`1314`"
      - "`1210`"
    answer: 1
    explanation: 整数どうしの割り算は、小数点以下が切り捨てられます。131340 / 100 は 1313 になります。
  - question: "商品名を表示するコードで、`商品: りんご` と表示されるものはどれですか？（`name = \"りんご\"`）"
    choices:
      - "`puts '商品: #{name}'`"
      - "`puts \"商品: #{name}\"`"
      - "`puts \"商品: \" + name.length`"
      - "`puts 商品: name`"
    answer: 1
    explanation: "式展開 `#{...}` が使えるのは `\"` で囲んだ文字列だけです。`'` で囲むと `#{name}` がそのまま表示されます。"
  - question: 税込金額を計算するとき、`price * 1.1` ではなく `price * 110 / 100` と書く理由はどれですか？
    choices:
      - 短く書けるから
      - 小数の計算で出る誤差で、金額が1円ずれることを防ぐため
      - "Rubyでは `1.1` のような小数が使えないから"
      - 計算が速くなるから
    answer: 1
    explanation: 小数の計算にはごくわずかな誤差が出ることがあります。お金の計算は整数で行い、端数の扱い（さくらマートでは切り捨て）をはっきりさせます。
