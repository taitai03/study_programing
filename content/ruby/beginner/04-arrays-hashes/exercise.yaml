ticket: |
  ## 背景
  CS（お客様対応）チームから「注文の問い合わせを受けたときに、注文データから必要な情報をすぐ取り出せるようにしたい」と依頼がありました。
  注文データ（`order`）は、注文管理システムから取り出したハッシュです。

  ## やること
  エディタのメソッドの中身（`TODO` の部分）を書いてください。

  1. `customer_name(order)`: 注文した会員の名前を返す
  2. `line_count(order)`: 注文明細（`items`）の行数を返す
  3. `first_product_name(order)`: 1行目の明細の商品名を返す。明細が1行もない場合は `nil` を返す（エラーにしない）
  4. `status_label(order)`: 注文ステータスの表示名を返す。表示名は定数 `STATUS_LABELS` にある
  5. `coupon_label(order)`: 使ったクーポンのコードを返す。クーポンを使っていない（`nil`）場合は `"なし"` を返す

  ## 受け入れ条件
  - [ ] 会員の名前が「山田 花子」になる
  - [ ] 明細の行数が 2 になる
  - [ ] 1行目の商品名が「国産りんごジュース 1L」になり、明細がない注文では `nil` になる
  - [ ] ステータスの表示名が「支払済」になり、ほかのステータスも正しい表示名になる
  - [ ] クーポンの表示が「SPRING500」になり、クーポンを使っていない注文では「なし」になる
