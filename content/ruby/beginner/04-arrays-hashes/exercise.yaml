solution: |
  STATUS_LABELS = {
    pending: "受付",
    paid: "支払済",
    shipped: "発送済",
    delivered: "完了",
    cancelled: "キャンセル",
  }

  order = {
    id: 1024,
    status: :paid,
    customer: { name: "山田 花子", rank: :gold },
    items: [
      { product_name: "国産りんごジュース 1L", unit_price: 398, quantity: 3 },
      { product_name: "竹のまな板", unit_price: 1980, quantity: 1 },
    ],
    coupon: "SPRING500",
  }

  def customer_name(order)
    order[:customer][:name]
  end

  def line_count(order)
    order[:items].size
  end

  def first_product_name(order)
    order.dig(:items, 0, :product_name)
  end

  def status_label(order)
    STATUS_LABELS[order[:status]]
  end

  def coupon_label(order)
    order[:coupon] || "なし"
  end
tests:
  - name: 会員の名前が「山田 花子」になる
    code: |
      expect(customer_name(order)).to eq("山田 花子")
  - name: 明細の行数が 2 になる
    code: |
      expect(line_count(order)).to eq(2)
  - name: 1行目の商品名が取り出せ、明細がない注文では nil になる
    code: |
      expect(first_product_name(order)).to eq("国産りんごジュース 1L")
      expect(first_product_name({ id: 1, status: :pending, items: [] })).to eq(nil)
  - name: ステータスの表示名が正しい
    code: |
      expect(status_label(order)).to eq("支払済")
      expect(status_label({ status: :shipped })).to eq("発送済")
      expect(status_label({ status: :cancelled })).to eq("キャンセル")
  - name: クーポンのコードが表示され、使っていない注文では「なし」になる
    code: |
      expect(coupon_label(order)).to eq("SPRING500")
      expect(coupon_label({ id: 2, coupon: nil })).to eq("なし")
hints:
  - "ハッシュの中のハッシュは、`order[:customer]` で取り出したものに、さらに `[:name]` を付けます。"
  - "「明細がないときに nil」は、解説の `dig` を使うとエラーにならずに書けます。"
  - "`STATUS_LABELS` は、ステータスのシンボルをキーにした対応表です。`STATUS_LABELS[:paid]` は `\"支払済\"` になります。"
  - "「nil なら代わりの値」は `||` で書けます。"
