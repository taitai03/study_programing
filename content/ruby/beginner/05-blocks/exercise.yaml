ticket: |
  ## 背景
  店長から「今日の売上と、商品ごとにいくつ売れたかを知りたい」と依頼がありました。
  今日の注文データ（`today_orders`）は、注文管理システムから取り出したものです。

  ## やること
  エディタのメソッドの中身（`TODO` の部分）を書いてください。

  1. `valid_orders(orders)`: キャンセル（`status` が `:cancelled`）を除いた注文の配列を返す
  2. `order_subtotal(order)`: 1つの注文の小計（単価 × 数量 の合計、税抜）を返す
  3. `total_sales(orders)`: 売上（キャンセルを除いた注文の小計の合計）を返す
  4. `quantity_by_product(orders)`: キャンセルを除いた注文で、商品ごとの販売数を `{ "商品名" => 数 }` のハッシュで返す

  ## 受け入れ条件
  - [ ] キャンセルを除いた注文が 4 件（注文番号 1, 2, 4, 5）になる
  - [ ] 注文番号1の小計が 1,690 円になる
  - [ ] 今日の売上が 6,652 円になる
  - [ ] 商品ごとの販売数が正しい（キャンセルされた注文の分は数えない）
  - [ ] 注文が0件のときは、空の配列・0・空のハッシュを返す
