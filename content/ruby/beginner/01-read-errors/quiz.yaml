questions:
  - question: "`NameError: undefined local variable or method 'totl' for main（5行目）` というエラーが出ました。最初に確認すべきことはどれですか？"
    choices:
      - プログラムを最初から書き直す
      - 5行目の `totl` のつづりが、定義した名前と合っているか
      - インターネットで「NameError」を調べて、出てきたコードを貼り付ける
      - エラーは気にせず、もう一度実行する
    answer: 1
    explanation: エラーメッセージは「どこで（5行目）」「何が（totl が定義されていない）」を教えてくれます。まずその場所を見て、名前のタイプミスがないか確認します。
  - question: "`puts 550` と `p \"550\"` を続けて実行したとき、出力はどうなりますか？"
    choices:
      - "`550` と `550` が表示される"
      - "`550` と `\"550\"` が表示される"
      - "`\"550\"` と `550` が表示される"
      - "`p` は何も表示しない"
    answer: 1
    explanation: "`puts` は値をそのまま表示し、`p` は値をRubyのコードに近い形で表示します。文字列には `\"` が付くので、数値と文字列を見分けられます。"
  - question: "`SyntaxError` が出て、`^` の印がファイルの最後の行を指しています。よくある原因はどれですか？"
    choices:
      - 最後の行の数字が間違っている
      - どこかで `end` を書き忘れている
      - Rubyのバージョンが古い
      - 変数の名前が長すぎる
    answer: 1
    explanation: "`end` を書き忘れると、Rubyはファイルの最後まで読んでから「閉じられていない」と気づきます。印の場所より前の行の `if` や `def` に、対応する `end` があるか確認しましょう。"
