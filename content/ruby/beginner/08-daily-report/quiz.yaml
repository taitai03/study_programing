questions:
  - question: "`[3, 10, 4].sort_by { |n| -n }` の結果はどれですか？"
    choices:
      - "`[3, 4, 10]`"
      - "`[10, 4, 3]`"
      - "`[-10, -4, -3]`"
      - "`[3, 10, 4]`"
    answer: 1
    explanation: "`sort_by` はブロックの結果の小さい順に並べます。-10, -4, -3 の順になるので、もとの値は 10, 4, 3 の大きい順になります。結果の配列に入るのはもとの値です。"
  - question: 仕様書に「注文が0件のときは平均を0にする」と書かれています。この条件を確かめずに `sales / orders.size` と書くと、0件のときどうなりますか？
    choices:
      - "`0` になる"
      - "`nil` になる"
      - "`ZeroDivisionError` になる"
      - "`Infinity` になる"
    answer: 2
    explanation: 整数を0で割ると `ZeroDivisionError` になります。データが0件のときのような特別なケースは、仕様書に書かれていなくても必ず確かめましょう。
  - question: 仕様書から大きな処理を作るときの進め方として、適切なものはどれですか？
    choices:
      - 全部を1つのメソッドに書いてから、最後にまとめて動かす
      - 小さなメソッドに分け、1つ書くたびに結果を確かめながら進める
      - 仕様書は読まずに、似たコードをコピーして直す
      - 特別なケース（0件など）は、本番で問題が起きてから直す
    answer: 1
    explanation: 小さく分けて少しずつ確かめると、間違いがあってもすぐに場所が分かります。0件のような特別なケースは、作っている段階で確かめます。
