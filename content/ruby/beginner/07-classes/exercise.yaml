ticket: |
  ## 背景
  ネットショップの買い物かごの画面で表示する金額を、クラスとして作ることになりました。
  商品クラス `Product` は途中まで作ってあります。買い物かごクラス `Cart` は、メソッドの名前だけ決まっています。

  ## やること
  ### `Product`
  - `name`（商品名）と `price`（税抜価格）を外から読めるようにする
  - `price_with_tax`: 税込価格を返す（端数は切り捨て）

  ### `Cart`
  - `add(product, quantity = 1)`: 商品を入れる。同じ商品を入れたら数量を増やす。数量が1未満なら `ArgumentError` にする
  - `item_count`: 入っている商品の数量の合計を返す
  - `subtotal`: 小計（税抜価格 × 数量 の合計）を返す
  - `total_with_tax`: 小計に消費税10%を加えた金額を返す（端数は切り捨て。商品ごとではなく、小計に対して計算する）
  - `shipping_fee`: 送料を返す。税込5,000円以上なら0円、それ以外は550円。ただし、かごが空なら0円
  - `total`: 支払う金額（税込金額 ＋ 送料）を返す

  ## 受け入れ条件
  - [ ] 商品の名前と価格が読め、税込価格が正しい（398円 → 437円）
  - [ ] 同じ商品を2回入れると、数量がまとまって増える
  - [ ] 数量が0個やマイナスのときは `ArgumentError` になる
  - [ ] りんごジュース3個と食パン2個のかごで、小計1,690円・税込1,859円・送料550円・合計2,409円になる
  - [ ] 竹のまな板を3個入れると、税込6,534円で送料が無料になる
  - [ ] 空のかごは、数量・小計・送料・合計がすべて0になる
