questions:
  - question: "`Product` クラスに `attr_reader` を書かずに、`juice = Product.new(name: \"りんご\", price: 398)` のあと `juice.name` を実行するとどうなりますか？"
    choices:
      - "`\"りんご\"` が返る"
      - "`nil` が返る"
      - "`NoMethodError` になる"
      - "`@name` が返る"
    answer: 2
    explanation: "インスタンス変数（`@name`）は、そのままではクラスの外から読めません。`attr_reader :name` を書くと、`name` というメソッドで読めるようになります。"
  - question: "インスタンス変数 `@quantities` についての説明で、正しいものはどれですか？"
    choices:
      - すべてのインスタンスで同じ値を共有する
      - インスタンスごとに別の値を持ち、そのクラスのどのメソッドからでも使える
      - "`initialize` の中でしか使えない"
      - クラスの外から自由に書き換えられる
    answer: 1
    explanation: "`@` で始まる変数はインスタンスごとに値を持ちます。2つの `Cart.new` で作ったかごは、それぞれ別の中身を持ちます。"
  - question: 買い物かごに数量0個で商品を入れようとしたとき、`ArgumentError` にする理由として適切なものはどれですか？
    choices:
      - エラーが出たほうがかっこいいから
      - ありえない値をその場ではじいておけば、あとで金額がおかしくなる原因を探さずに済むから
      - Rubyでは0を扱えないから
      - 画面にエラーを表示するため
    answer: 1
    explanation: おかしな値を受け付けると、問題が起きたのとは別の場所（金額の計算や請求）で不具合として現れ、原因を探すのが難しくなります。入り口ではじくのが基本です。
