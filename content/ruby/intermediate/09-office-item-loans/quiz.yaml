questions:
  - question: 「備品が貸出中かどうか」を、備品のテーブルの status 列に持たせず、「返却されていない貸出があるか」で判断する利点はどれですか？
    choices:
      - 画面の表示が速くなる
      - 同じ事実を二重に持たないので、貸出の記録と status が食い違うことがない
      - テーブルの数が減る
      - マイグレーションが不要になる
    answer: 1
    explanation: 同じ事実を2か所に持つと、片方だけ更新して食い違う不具合が起きやすくなります。記録から導けることは、なるべく二重に持たないようにします。
  - question: "`validate :due_on_within_range, on: :create` の `on: :create` は何のためですか？"
    choices:
      - バリデーションを速くするため
      - 作るとき（貸し出すとき）だけ確かめ、返却などの更新では確かめないようにするため
      - DBの制約にするため
      - エラーメッセージを日本語にするため
    answer: 1
    explanation: 返却予定日を過ぎた貸出を返却するとき（更新）に、「返却予定日は今日以降」のチェックで失敗しないよう、作るときだけ確かめます。
  - question: Rails のアプリで「今日の日付」を得るときに、`Date.today` より `Date.current` を使う理由はどれですか？
    choices:
      - "`Date.today` は Ruby では使えないから"
      - "`Date.current` はアプリのタイムゾーン（config.time_zone）の日付を返すので、サーバーのタイムゾーンに左右されないから"
      - "`Date.current` のほうが速いから"
      - 違いはない
    answer: 1
    explanation: "`Date.today` はサーバー（OS）のタイムゾーンの日付です。本番のサーバーが UTC だと、日本時間の朝9時より前は前日になってしまいます。"
