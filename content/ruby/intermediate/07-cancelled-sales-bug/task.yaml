ticket: |
  ## 背景

  経理チームから問い合わせ（CS-1203）が来ています。

  > 管理画面のダッシュボードの「今月の売上」が、経理で集計した金額より多くなっています。調べてみると、キャンセルになった注文の金額が入っているようです。3月の途中から合わなくなりました。今日の売上は合っています。

  ## やること

  - 問い合わせの現象を手元で再現し、**原因** を調べる
  - 原因を直す（同じ原因で影響しているほかの集計も）
  - 同じバグが再発しないように、テストを追加する

  ## 受け入れ条件

  - [ ] ダッシュボードの売上の集計（今日、今月、日ごと）に、キャンセルの注文が含まれない
  - [ ] キャンセル以外の注文の集計は、いままでと変わらない
  - [ ] 再発防止のテストを追加している
  - [ ] PRの説明に、原因と直し方、影響の範囲を書いている
  - [ ] 既存のテストがすべて通る

  ## 参考

  - 売上の集計: `app/models/sales_summary.rb`、注文: `app/models/order.rb`
  - `git log -p` で、関係するファイルの変更の履歴を見られます
hints:
  - |
    まず、キャンセルの注文を含むデータで `SalesSummary` の各メソッドを呼ぶテストを書いて、どれが期待と違うかを確かめましょう。`bin/rails console` で試すこともできます。
  - |
    「今日の売上は合っている」がヒントです。`today` と `this_month` のコードを並べて、注文を絞り込んでいる部分の違いを見比べましょう。
  - |
    `Order.ordered_in(...).to_sql` と `Order.for_sales.where(...).to_sql` を console で見比べると、WHERE の条件の違いが分かります。
