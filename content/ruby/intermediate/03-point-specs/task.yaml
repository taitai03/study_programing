ticket: |
  ## 背景

  CSチームに「注文の明細で計算したポイントと、付与されたポイントが1ポイント合わないことがある」という問い合わせが何件か来ています。ポイント計算（`app/models/point_calculator.rb`）にはテストがありません。**テストを書いて仕様どおりかを確かめ、見つかった不具合を直してください。**

  ## ポイント計算の仕様

  `PointCalculator.points(tax_included, rank)`

  - `tax_included` は、割引と消費税を反映した金額（送料を含まない）
  - 一般（`"regular"`）・シルバー（`"silver"`）会員は1%、ゴールド（`"gold"`）会員は2%
  - 端数は **切り捨て**
  - 金額が0以下のときは0

  ## やること

  1. `spec/models/point_calculator_spec.rb` を作り、上の仕様を確かめるテストを書く（正常系・境界値・異常系）
  2. テストで見つかった不具合を `app/models/point_calculator.rb` で直す

  ## 受け入れ条件

  - [ ] `spec/models/point_calculator_spec.rb` に、仕様を確かめるテストがある
  - [ ] あなたのテストが、こちらで用意した **バグ入りのポイント計算（5種類）をすべて見つけられる**（PRのチェックで、バグを入れた実装にあなたのテストを当てて、失敗することを確かめます）
  - [ ] ポイント計算の不具合が直っている
  - [ ] 既存のテストがすべて通る

  ## 参考

  - RSpec: https://rspec.info/documentation/
  - 手元で「テストのテスト」をするには `bash .task/check.sh` を実行します
hints:
  - |
    仕様の1行ごとに、少なくとも1つのテストを書きましょう。ランクは3種類あるので、それぞれの率を確かめるテストが必要です。
  - |
    「端数は切り捨て」を確かめるには、計算結果の小数がちょうど .5 になる金額（1,250円 × 1% = 12.5）や、.9 に近い金額（1,299円 × 1% = 12.99）を使います。
  - |
    `bash .task/check.sh` を実行すると、どんなバグを見つけられなかったかが表示されます。
