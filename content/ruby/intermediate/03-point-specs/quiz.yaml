questions:
  - question: 「税込5,000円以上なら送料無料」という仕様をテストするとき、境界値として特に確かめるべき金額の組み合わせはどれですか？
    choices:
      - 1,000円と10,000円
      - 4,999円と5,000円
      - 0円と100,000円
      - 5,500円だけ
    answer: 1
    explanation: 結果が切り替わる境目（5,000円）と、そのすぐ手前（4,999円）を確かめます。`>` と `>=` の書き間違いはここでしか見つかりません。
  - question: バグを直すときに「先にバグを再現するテストを書いて、失敗することを確かめる」のはなぜですか？
    choices:
      - テストを書く時間を短くするため
      - そのテストが本当にバグを見つけられることを確かめ、直したあとに再発も防げるから
      - 先にテストを書かないと、コードを直せないから
      - CIの時間を短くするため
    answer: 1
    explanation: 直す前に失敗することを確かめておけば、そのテストがバグを捉えていると分かります。直したあとはテストが通り、同じバグが戻ってきたら気づけます。
  - question: "`expect { coupon.discount_for(999) }.to raise_error(Coupon::NotApplicable)` で、`expect` にブロック（`{ }`）を渡している理由はどれですか？"
    choices:
      - 書き方の好みで、かっこでも同じ
      - ブロックにしないと、expect に渡す前に例外が起きてテスト自体が止まってしまうから
      - 処理を速くするため
      - ブロックでないとクラスメソッドを呼べないから
    answer: 1
    explanation: "`expect(coupon.discount_for(999))` と書くと、expect が呼ばれる前に例外が起きます。ブロックで渡すと、expect の中で実行して例外を受け止められます。"
