questions:
  - question: 商品の登録に成功したあと、画面を直接表示せずにリダイレクトする理由はどれですか？
    choices:
      - 画面の表示が速くなるから
      - ブラウザをリロードしたときに、同じ登録がもう一度送られるのを防ぐため
      - フラッシュメッセージはリダイレクトしないと使えないから
      - Rails の決まりで、リダイレクトしないとエラーになるから
    answer: 1
    explanation: POST の結果を直接表示すると、リロードで同じ POST が送られ、二重に登録されます。成功したらリダイレクトして、GET の画面を表示します。
  - question: "`Product.new(params[:product])` のように、フォームの値を許可せずにそのまま渡すと、どんな問題がありますか？"
    choices:
      - 問題はない
      - フォームにない項目（id や権限など）も送られてきたら、そのまま保存されてしまう
      - 日本語が文字化けする
      - バリデーションが動かなくなる
    answer: 1
    explanation: リクエストは改造できるので、フォームにない項目も送れます（Mass Assignment）。Strong Parameters で受け付ける項目を明示的に許可します。
  - question: 'バリデーションに失敗したとき、`render :new, status: :unprocessable_content` とする理由として正しいものはどれですか？'
    choices:
      - 入力した値とエラーを持った @product でフォームを表示し直すため。422 は Turbo が失敗した送信として扱うために必要
      - 商品一覧に戻るため
      - エラーをログに出すため
      - 422 にすると、入力した値が消えるため
    answer: 0
    explanation: render は同じリクエストの中でビューを表示するので、@product の入力値とエラーが残ります。Turbo は 4xx/5xx の応答をフォームの失敗として扱い、画面を描き直します。
